name: build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # 1.x 的 WinForms 构建；2.x (WinUI) 由本地 publish-winui.ps1 出包，这里跳过
    if: ${{ !startsWith(github.ref_name, 'v2.') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $csc = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter csc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "csc: $($csc.FullName)"
          $rc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter rc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "rc:  $($rc.FullName)"
          exit 0

      - name: Build portable zip + installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem .\dist | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskBoxToDo-setup
          path: |
            dist/DeskBoxToDo_Setup_*.exe
            dist/DeskBoxToDo_*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeskBoxToDo_Setup_*.exe
            dist/DeskBoxToDo_*.zip
          generate_release_notes: true